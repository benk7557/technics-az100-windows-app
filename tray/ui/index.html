<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Technics AZ100</title>
<link rel="stylesheet" href="style.css">
</head>
<body data-phase="loading">
<main class="plate" id="plate" tabindex="-1" aria-busy="true">
  <header class="head">
    <h1>EAH-AZ100</h1>
    <p class="link sk" id="link"></p>
  </header>

  <div class="seg" role="radiogroup" aria-label="Listening mode" id="seg">
    <button type="button" role="radio" aria-checked="false" tabindex="-1" data-mode="0">Off</button>
    <button type="button" role="radio" aria-checked="false" tabindex="-1" data-mode="1">Noise cancelling</button>
    <button type="button" role="radio" aria-checked="false" tabindex="-1" data-mode="2">Ambient</button>
  </div>

  <div class="opts" id="opts">
    <p class="note" id="optOff" hidden>Noise cancelling and ambient sound are off.</p>
    <div id="optNc" hidden>
      <button type="button" class="switch" id="auto" role="switch" aria-checked="false" aria-describedby="autoHelp">
        <span class="t">Auto level</span>
        <span class="trk" aria-hidden="true"><span class="knob"></span></span>
      </button>
      <p class="note" id="autoHelp">The earbuds choose the level for you.</p>
    </div>
    <div id="optAmb" hidden>
      <div class="seg sub" role="radiogroup" aria-label="Ambient sound type" id="sub">
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-sub="0">Transparent</button>
        <button type="button" role="radio" aria-checked="false" tabindex="-1" data-sub="1">Attention</button>
      </div>
      <p class="note" id="subHelp"></p>
    </div>
  </div>

  <section class="level" aria-labelledby="levelLabel">
    <div class="levelrow">
      <label id="levelLabel" for="level">Noise cancelling level</label>
      <output id="levelOut" for="level" class="sk"></output>
    </div>
    <input id="level" type="range" min="1" max="100" step="1" value="1" aria-describedby="status">
    <div class="ticks" aria-hidden="true">
      <span style="--p:0">1</span><span style="--p:.2424">25</span><span style="--p:.4949">50</span><span style="--p:.7475">75</span><span style="--p:1">100</span>
    </div>
  </section>

  <section class="battery" aria-labelledby="battLabel">
    <h2 id="battLabel">Battery</h2>
    <svg id="plot" viewBox="0 0 312 60" width="312" height="60" role="img" aria-label="Battery levels"></svg>
  </section>

  <section class="movie" id="movieRow" aria-label="Movie mode">
    <button type="button" class="switch" id="movie" role="switch" aria-checked="false" aria-describedby="movieStatus" data-unknown disabled>
      <span class="t">Movie mode</span>
      <span class="trk" aria-hidden="true"><span class="knob"></span></span>
    </button>
    <p class="note" id="movieStatus"></p>
    <div class="bar" id="movieBar" aria-hidden="true"><i></i></div>
  </section>

  <footer class="foot">
    <p id="status" role="status" aria-live="polite">Reading the earbuds</p>
    <button type="button" id="retry" hidden>Try again</button>
  </footer>
</main>
<script src="app.js"></script>
</body>
</html>
